<style>
svg{--bg:#faf8f3;--surface:#faf8f3;--fg:#1f1d1a;--muted:#5e5a53;--accent:#9a3b1f;--rule:rgba(31,29,26,.3);--c1:#9a3b1f;--c2:#2d5992;--c3:#539661;--c4:#c9a227;--font-head:ui-serif, Georgia, "Times New Roman", serif;--font-body:ui-serif, Georgia, "Times New Roman", serif;--font-mono:ui-monospace, "Cascadia Code", Consolas, Menlo, monospace;--radius:0;--maxw:44rem;--wide:64rem;--t1:2.25rem;--t2:1.5rem;--t3:1.125rem;--t4:0.875rem}
@media (prefers-color-scheme: dark){svg{--bg:#1c1b19;--surface:#1c1b19;--fg:#ece8df;--muted:#a8a29a;--accent:#e07a55;--rule:rgba(236,232,223,.3);--c1:#d9734f;--c2:#6597d3;--c3:#438551;--c4:#b0901d}}
text{font:11px var(--font-body);fill:var(--muted)}
.gr{stroke:var(--rule);stroke-width:1;fill:none}
.b{fill:var(--c1)}
.v{fill:var(--fg)}
.ar{fill-opacity:.14;stroke:none}
.ln{fill:none;stroke-width:1.5;stroke-linejoin:round}
.k1{fill:var(--c1);stroke:var(--c1)}
.k2{fill:var(--c2);stroke:var(--c2)}
.k3{fill:var(--c3);stroke:var(--c3)}
.k4{fill:var(--c4);stroke:var(--c4)}
.ar.k1,.ar.k2,.ar.k3,.ar.k4{stroke:none}
.ln.k1,.ln.k2,.ln.k3,.ln.k4{fill:none}
.lb{fill:var(--fg);font-style:italic;paint-order:stroke;stroke:var(--bg);stroke-width:3px;stroke-linejoin:round}
.c{fill:var(--c1)}
.cv{fill:var(--fg);paint-order:stroke;stroke:var(--bg);stroke-width:3px;stroke-linejoin:round}
</style>
